<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HARDCPY</title>
  <meta name="description" content="HARDcpy is a curated library of fashion, art books, magazines, DVDs, catalogs, etc.">
  <meta property="og:type" content="product">
  <meta property="og:site_name" content="HARDCPY">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%236e2b2b'/></svg>">
</head>
<body class="product-page">

  <header class="site-head">
    <a class="logo" href="index.html">HARDcpy</a>
    <button class="navlink stack-tab" data-cart-tab>Stack (0)</button>
  </header>
  <button id="menu-tab" class="burger" aria-controls="menu-overlay" aria-expanded="false" aria-label="Menu">
    <span class="line"></span>
    <span class="line"></span>
  </button>

  <div class="meta">
    <a class="navlink" href="index.html">← Shop</a>
    <span id="product-crumb"></span>
  </div>

  <main class="product-main">
    <div id="gallery" class="gallery"></div>

    <div class="product-info">
      <div class="product-copy">
        <h1 id="p-title"></h1>
        <p id="p-price" class="p-price"></p>
        <div id="p-desc" class="p-desc"></div>
      </div>

      <div class="product-specs">
        <ul id="spec-list" class="spec-list"></ul>
        <button id="add-btn" class="buy-btn">ADD TO STACK</button>
      </div>
    </div>

    <nav class="product-pager">
      <a id="prev-link" hidden>← PREV</a>
      <a id="next-link" hidden>NEXT →</a>
    </nav>
  </main>

  <footer class="site-footer">
    <span>© 2026 HARDCPY</span>
  </footer>

  <nav id="menu-overlay" class="menu-overlay">
    <div class="menu-inner">
      <h2 class="menu-brand"><a href="index.html">HARD<br>cpy</a></h2>
      <ul class="menu-list">
        <li><a href="index.html">Shop All</a></li>
        <li><a href="index.html?type=Books/Catalogs">Books/Catalogs</a></li>
        <li><a href="index.html?type=Magazines">Magazines</a></li>
        <li><a href="#" data-cart-tab>Stack</a></li>
        <li><button id="contact-toggle" class="menu-link-btn" aria-expanded="false">Contact</button></li>
      </ul>
      <form id="contact-form" class="menu-contact" method="POST"
            action="https://formsubmit.co/officialouioui@gmail.com" hidden>
        <input type="hidden" name="_subject" value="HARDcpy — new message">
        <input type="hidden" name="_captcha" value="false">
        <input type="hidden" name="_next" value="https://hardcpy.shop/?sent=1">
        <input type="text" name="_honey" style="display:none" tabindex="-1" autocomplete="off">
        <label>Name
          <input type="text" name="name" required autocomplete="name">
        </label>
        <label>Email
          <input type="email" name="email" required autocomplete="email">
        </label>
        <label>Message
          <textarea name="message" rows="4" required></textarea>
        </label>
        <button type="submit" class="contact-send">Send</button>
      </form>
      <p class="menu-about">
        HARDcpy is a curated library of fashion, art books, magazines, DVDs, catalogs, etc.
      </p>
    </div>
  </nav>

  <script src="data/books.js"></script>
  <script src="js/config.js"></script>
  <script src="js/main.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/lightbox.js"></script>
  <script src="js/product.js"></script>
  <script src="js/analytics.js"></script>
</body>
</html>
